<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEB Maarif Modeli - Etkileşimli Yazı ve Çizim Asistanı</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Quicksand for high classroom legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* MEB standard 4 notebook lines */
    .line-ascender, .line-descender {
      stroke: #ef4444; /* Boundary red */
      stroke-width: 3.5;
    }
    .line-core-top, .line-core-base {
      stroke: #2563eb; /* Primary writing blue */
      stroke-width: 4;
    }

    /* Guide path underneath */
    .ghost-stroke {
      stroke: #cbd5e1;
      stroke-width: 24;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 8 8;
    }

    /* Active ink stroke */
    .active-ink {
      stroke: #1e3a8a;
      stroke-width: 26;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Finished ink stroke */
    .completed-ink {
      stroke: #1e40af;
      stroke-width: 26;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Student Practice Canvas */
    #practiceCanvas {
      touch-action: none;
      cursor: crosshair;
    }

    .pencil-shadow {
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
    }

    .btn-press {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-press:active {
      transform: scale(0.93);
    }

    /* Custom scrollbar for horizontal character picker */
    .hide-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .hide-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .hide-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .hide-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

  <!-- Header Bar -->
  <header class="bg-white border-b-2 sm:border-b-4 border-indigo-200 shadow-sm px-3 py-2 sm:px-6 sm:py-3 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <!-- Title & Branding -->
      <div class="flex items-center space-x-2.5 sm:space-x-3">
        <div id="activeCharAvatar" class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-gradient-to-tr from-amber-400 via-rose-400 to-indigo-500 flex items-center justify-center text-white font-black text-xl sm:text-2xl shadow-sm sm:shadow-md border-2 border-white shrink-0">
          a
        </div>
        <div>
          <h1 class="text-sm sm:text-lg md:text-xl font-black text-slate-800 tracking-tight leading-tight">
            Etkileşimli Yazı Asistanı <span class="text-indigo-600 block sm:inline">| Dik Temel Harfler</span>
          </h1>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Audio Toggle -->
        <button id="audioToggleBtn" class="btn-press flex items-center justify-center gap-1.5 bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 p-2 sm:px-3 sm:py-2 rounded-xl text-amber-900 font-bold text-xs sm:text-sm shadow-sm" title="Ses Açık/Kapalı">
          <svg id="soundIcon" class="w-4 h-4 text-amber-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          </svg>
          <span class="hidden md:inline" id="soundLabel">Ses: Açık</span>
        </button>

        <!-- Fullscreen Toggle for Akıllı Tahta / Mobile -->
        <button id="fullscreenBtn" class="btn-press flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 p-2 sm:px-3 sm:py-2 rounded-xl text-slate-700 font-bold text-xs sm:text-sm shadow-sm" title="Tam Ekran">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0 0l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
          </svg>
          <span class="hidden md:inline">Tam Ekran</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Category & Character Navigation Bar -->
  <section id="categoryNavSection" class="bg-white/95 backdrop-blur-md border-b border-indigo-200 py-2 px-2 sm:px-6 shadow-sm">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-center gap-2 sm:gap-5">
      
      <!-- Category Tabs -->
      <div class="flex items-center gap-1 bg-slate-200/80 p-1 rounded-xl sm:rounded-2xl shrink-0">
        <button data-cat="kucuk" class="cat-tab px-3 sm:px-4 py-1.5 rounded-lg sm:rounded-xl font-extrabold text-xs sm:text-sm bg-white text-indigo-700 shadow-sm transition-all text-center whitespace-nowrap">
          Küçük
        </button>
        <button data-cat="buyuk" class="cat-tab px-3 sm:px-4 py-1.5 rounded-lg sm:rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all text-center whitespace-nowrap">
          Büyük
        </button>
        <button data-cat="rakam" class="cat-tab px-3 sm:px-4 py-1.5 rounded-lg sm:rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all text-center whitespace-nowrap">
          Rakam
        </button>
        <button data-cat="noktalama" class="cat-tab px-3 sm:px-4 py-1.5 rounded-lg sm:rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all text-center whitespace-nowrap">
          Noktalama
        </button>
      </div>

      <!-- Quick Prev / Next Navigator with Horizontal Strip -->
      <div class="flex items-center gap-1.5 w-auto max-w-xl justify-center">
        <button id="prevCharBtn" class="btn-press p-2 rounded-xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-indigo-700 border border-slate-300 shadow-sm shrink-0 touch-manipulation" title="Önceki (Sol Ok)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <!-- Dynamic Character List Ribbon -->
        <div id="characterRibbon" class="flex items-center gap-1.5 overflow-x-auto py-1 px-1 hide-scrollbar flex-1 scroll-smooth">
          <!-- Populated by JS -->
        </div>

        <button id="nextCharBtn" class="btn-press p-2 rounded-xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-indigo-700 border border-slate-300 shadow-sm shrink-0 touch-manipulation" title="Sonraki (Sağ Ok)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

    </div>
  </section>

  <!-- Main Interactive Display Zone -->
  <main class="max-w-6xl w-full mx-auto px-2 sm:px-4 py-2 sm:py-3 flex-1 flex flex-col justify-center">

    <!-- Guidelines zone info pill -->
    <div id="guidanceBar" class="flex items-center justify-end mb-1 sm:mb-2 px-1 transition-all duration-200">
      <div id="zoneInfoPill" class="flex items-center gap-1.5 bg-indigo-50 text-indigo-800 border border-indigo-200 text-[11px] sm:text-xs px-2.5 sm:px-3 py-1 rounded-xl font-bold">
        <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
        <span id="zoneDescription">Orta Gövde Alanı (2 - 3. Çizgiler Arası)</span>
      </div>
    </div>

    <!-- Notebook Board Container (4 Lines, 3 Intervals MEB Standard) -->
    <div class="relative w-full bg-white rounded-3xl shadow-2xl border-4 border-slate-300 overflow-hidden" style="aspect-ratio: 16/9; max-height: 530px;">
      
      <!-- Primary SVG Writing Stage -->
      <svg id="boardSvg" viewBox="0 0 1000 560" class="w-full h-full block">
        <defs>
          <pattern id="dotPattern" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx="14" cy="14" r="1.2" fill="#e2e8f0" />
          </pattern>
          
          <!-- Direction marker arrowheads -->
          <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
          </marker>
          <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
          </marker>
          <marker id="arrowEmerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
          </marker>
        </defs>

        <!-- Base Background Grid -->
        <rect width="1000" height="560" fill="#ffffff" />
        <rect width="1000" height="560" fill="url(#dotPattern)" />

        <!-- NOTEBOOK BANDS (3 INTERVALS)
             Line 1 (Top Ascender): Y = 90
             Line 2 (Upper Core):   Y = 230
             Line 3 (Base Core):    Y = 390
             Line 4 (Descender):    Y = 510
        -->

        <!-- Dynamic Band Highlight Backgrounds -->
        <!-- Upper Band: Y: 90 - 230 (Height: 140) -->
        <rect id="bandUpper" x="0" y="90" width="1000" height="140" fill="#fef3c7" fill-opacity="0" class="transition-all duration-500" />
        
        <!-- Core Middle Band: Y: 230 - 390 (Height: 160) -->
        <rect id="bandMiddle" x="0" y="230" width="1000" height="160" fill="#fef3c7" fill-opacity="0.65" class="transition-all duration-500" />
        
        <!-- Lower Descender Band: Y: 390 - 510 (Height: 120) -->
        <rect id="bandLower" x="0" y="390" width="1000" height="120" fill="#fef3c7" fill-opacity="0" class="transition-all duration-500" />

        <!-- Zone Labels on Left Edge for Students & Teachers -->
        <g id="zoneLabels" class="opacity-75">
          <text x="24" y="165" fill="#94a3b8" font-size="14" font-weight="700">Üst Aralık</text>
          <text x="24" y="315" fill="#d97706" font-size="15" font-weight="800">Orta Aralık (Gövde)</text>
          <text x="24" y="455" fill="#94a3b8" font-size="14" font-weight="700">Alt Aralık (Kuyruk)</text>
        </g>

        <!-- MEB Standard 4 Horizontal Lines -->
        <line x1="10" y1="90" x2="990" y2="90" class="line-ascender" stroke-dasharray="10 6"/>
        <line x1="10" y1="230" x2="990" y2="230" class="line-core-top" />
        <line x1="10" y1="390" x2="990" y2="390" class="line-core-base" />
        <line x1="10" y1="510" x2="990" y2="510" class="line-descender" stroke-dasharray="10 6"/>

        <!-- Line Numbers on Right Edge -->
        <g fill="#64748b" font-size="13" font-weight="bold" text-anchor="middle">
          <circle cx="975" cy="90" r="11" fill="#fee2e2"/>
          <text x="975" y="94" fill="#dc2626">1</text>
          
          <circle cx="975" cy="230" r="11" fill="#dbeafe"/>
          <text x="975" y="234" fill="#1e40af">2</text>
          
          <circle cx="975" cy="390" r="11" fill="#dbeafe"/>
          <text x="975" y="394" fill="#1e40af">3</text>
          
          <circle cx="975" cy="510" r="11" fill="#fee2e2"/>
          <text x="975" y="514" fill="#dc2626">4</text>
        </g>

        <!-- DYNAMIC CHARACTER SVG LAYERS -->
        <!-- Layer 1: Dashed Ghost template -->
        <g id="ghostGroup"></g>

        <!-- Layer 2: Completed and active animated strokes -->
        <g id="inkGroup"></g>

        <!-- Layer 3: Direction numbers and instructional arrows -->
        <g id="guidesGroup"></g>

        <!-- Layer 4: Real-time Moving Pencil Tracer -->
        <g id="pencilTracer" class="pencil-shadow" transform="translate(0, 0)" style="display: none;">
          <!-- 3D style wooden pencil -->
          <g transform="rotate(-40) translate(-7, -68)">
            <!-- Main pencil body -->
            <polygon points="0,20 18,20 18,60 0,60" fill="#f59e0b" />
            <rect x="6" y="20" width="6" height="40" fill="#fbbf24" />
            <!-- Eraser ferrule -->
            <rect x="0" y="12" width="18" height="8" fill="#cbd5e1" />
            <path d="M 0,12 C 0,5 18,5 18,12 Z" fill="#f43f5e" />
            <!-- Wood tip -->
            <polygon points="0,60 18,60 9,76" fill="#fde68a" />
            <!-- Graphite lead tip -->
            <polygon points="6,71 12,71 9,76" fill="#1e293b" />
          </g>
          <!-- Pulsing dot right under lead tip -->
          <circle cx="0" cy="0" r="6" fill="#2563eb" class="animate-ping" opacity="0.65" />
          <circle cx="0" cy="0" r="4.5" fill="#1e3a8a" />
        </g>
      </svg>

      <!-- Student Touch / Mouse Practice Canvas -->
      <canvas id="practiceCanvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-0 transition-opacity duration-300"></canvas>

      <!-- Practice Mode Info Banner -->
      <div id="practiceBanner" class="hidden absolute top-2 sm:top-3 left-1/2 -translate-x-1/2 bg-amber-400 text-amber-950 font-black px-3 py-1 sm:px-4 sm:py-1.5 rounded-xl sm:rounded-2xl shadow-lg border-2 border-amber-500 items-center gap-1.5 text-[11px] sm:text-sm whitespace-nowrap z-20">
        <svg class="w-4 h-4 text-amber-950 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
        </svg>
        <span>Sen de Çiz: Parmağınla veya kalemle çiz!</span>
      </div>

    </div>

    <!-- Control Deck & Tools -->
    <div class="mt-2 sm:mt-3 bg-white rounded-2xl sm:rounded-3xl p-2.5 sm:p-4 border-2 border-indigo-100 shadow-md flex flex-wrap items-center justify-between gap-2 sm:gap-3">
      
      <!-- Left Controls: Play / Pause / Replay / Practice -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 flex-wrap">
        <!-- Play / Pause -->
        <button id="playPauseBtn" class="btn-press bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-xl sm:rounded-2xl shadow flex items-center gap-1.5 text-xs sm:text-sm touch-manipulation">
          <svg id="playIcon" class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span id="playBtnLabel">Durdur</span>
        </button>

        <!-- Replay -->
        <button id="replayBtn" class="btn-press bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 font-extrabold px-2.5 sm:px-3.5 py-2 sm:py-2.5 rounded-xl sm:rounded-2xl border border-indigo-200 flex items-center gap-1 text-xs sm:text-sm touch-manipulation" title="Baştan Yaz">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span class="hidden sm:inline">Baştan Yaz</span>
        </button>

        <!-- Student Practice Mode Toggle -->
        <button id="practiceToggleBtn" class="btn-press bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl sm:rounded-2xl shadow-sm flex items-center gap-1.5 text-xs sm:text-sm border-2 border-amber-500 touch-manipulation">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          <span id="practiceToggleLabel">Sen de Çiz</span>
        </button>

        <!-- Canvas Tools (Color Pickers & Clear) -->
        <div id="practiceDrawingTools" class="hidden items-center gap-1.5 pl-1 border-l-2 border-slate-200">
          <!-- Ink Colors -->
          <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
            <button data-pen-color="#dc2626" class="pen-color-btn w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-red-600 ring-2 ring-red-400 ring-offset-1"></button>
            <button data-pen-color="#2563eb" class="pen-color-btn w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-blue-600"></button>
            <button data-pen-color="#16a34a" class="pen-color-btn w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-emerald-600"></button>
            <button data-pen-color="#9333ea" class="pen-color-btn w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-purple-600"></button>
          </div>

          <!-- Clear Canvas -->
          <button id="clearCanvasBtn" class="btn-press bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-2 sm:px-3 py-1.5 sm:py-2 rounded-xl border border-rose-200 text-xs flex items-center gap-1 touch-manipulation">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            <span>Sil</span>
          </button>
        </div>
      </div>

      <!-- Right Controls: Speed & Guidance Toggles -->
      <div class="flex items-center gap-1.5 sm:gap-2.5">
        <!-- Speed Buttons -->
        <div class="flex items-center bg-slate-100 p-0.5 sm:p-1 rounded-xl sm:rounded-2xl border border-slate-200">
          <span class="text-xs font-bold text-slate-500 px-1 hidden md:inline">Hız:</span>
          <button data-speed="0.5" class="speed-toggle-btn px-2 py-1 rounded-lg sm:rounded-xl font-bold text-xs text-slate-600 hover:text-slate-900 touch-manipulation">0.5x</button>
          <button data-speed="1.0" class="speed-toggle-btn px-2 py-1 rounded-lg sm:rounded-xl font-black text-xs bg-white text-indigo-700 shadow-sm touch-manipulation">1x</button>
          <button data-speed="1.5" class="speed-toggle-btn px-2 py-1 rounded-lg sm:rounded-xl font-bold text-xs text-slate-600 hover:text-slate-900 touch-manipulation">1.5x</button>
        </div>

        <!-- Direction Indicators Toggle -->
        <button id="toggleArrowsBtn" class="btn-press bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl text-xs sm:text-sm border border-slate-300 flex items-center gap-1 touch-manipulation" title="Yön Okları">
          <svg class="w-4 h-4 text-slate-500 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
          <span id="arrowsBtnText" class="hidden sm:inline">Oklar</span>
        </button>
      </div>

    </div>

    <!-- Educational Bottom Help Bar (Hidden on Mobile to preserve space) -->
    <footer class="mt-2 text-center text-slate-500 text-xs hidden sm:flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
      <span class="inline-flex items-center gap-1 font-bold text-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        Klavye Kısayolları:
      </span>
      <span><kbd class="px-1.5 py-0.5 bg-slate-200 rounded font-mono text-slate-800">Boşluk</kbd> Durdur / Başlat</span>
      <span><kbd class="px-1.5 py-0.5 bg-slate-200 rounded font-mono text-slate-800">R</kbd> Baştan Yaz</span>
      <span><kbd class="px-1.5 py-0.5 bg-slate-200 rounded font-mono text-slate-800">← / →</kbd> Önceki / Sonraki Karakter</span>
    </footer>

  </main>

  <script>
    /**
     * CHARACTER DATABASE FOR TURKISH DIK TEMEL HARFLER
     * Line Coordinates:
     * Line 1 = 90  (Top Ascender)
     * Line 2 = 230 (Upper Core)
     * Line 3 = 390 (Base Core)
     * Line 4 = 510 (Descender)
     */
    const CHARACTERS_DATA = [
      // ==========================================
      // KÜÇÜK HARFLER (29 TÜRKÇE HARF)
      // ==========================================
      {
        id: 'a', char: 'a', category: 'kucuk', groupName: '1. Grup (ANETİL)', band: 'orta',
        bandDesc: 'Orta Gövde Alanı (2 - 3. Çizgiler Arası)',
        steps: [
          { d: 'M 545,268 C 535,244 515,242 498,242 C 452,242 422,274 422,310 C 422,348 452,378 498,378 C 532,378 548,354 548,310 L 548,270', desc: '1. Çemberi saat 2 yönünden sola yuvarla ve kapat', duration: 2000, arrow: { x: 500, y: 242, dx: -20, dy: 0, marker: 'arrowRed' }, num: { x: 550, y: 242, text: '1', color: '#ef4444' } },
          { d: 'M 548,242 L 548,382', desc: '2. Sağ teğetten aşağıya dik in', duration: 900, arrow: { x: 575, y: 290, dx: 0, dy: 35, marker: 'arrowBlue' }, num: { x: 575, y: 245, text: '2', color: '#2563eb' } }
        ]

    // Web Audio Synthesizer
    let audioContext = null;

    function initAudio() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.25, volume = 0.15) {
      if (isSoundMuted) return;
      try {
        initAudio();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);

        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + duration);
      } catch (err) {
        console.warn("Audio play error", err);
      }
    }

    // Set line zone highlighting according to character anatomy
    function updateBandHighlights(band) {
      bandUpper.setAttribute('fill-opacity', '0');
      bandMiddle.setAttribute('fill-opacity', '0');
      bandLower.setAttribute('fill-opacity', '0');

      if (band === 'orta') {
        bandMiddle.setAttribute('fill-opacity', '0.65');
        zoneDescription.textContent = 'Orta Gövde Alanı (2 - 3. Çizgiler Arası)';
      } else if (band === 'ust_orta') {
        bandUpper.setAttribute('fill-opacity', '0.45');
        bandMiddle.setAttribute('fill-opacity', '0.65');
        zoneDescription.textContent = 'Üst ve Orta Alan (1 - 3. Çizgiler Arası)';
      } else if (band === 'orta_alt') {
        bandMiddle.setAttribute('fill-opacity', '0.65');
        bandLower.setAttribute('fill-opacity', '0.45');
        zoneDescription.textContent = 'Orta ve Alt Kuyruk Alanı (2 - 4. Çizgiler Arası)';
      } else if (band === 'nokta') {
        bandMiddle.setAttribute('fill-opacity', '0.35');
        zoneDescription.textContent = 'Taban Çizgisi Üzerinde (3. Çizgi)';
      }
    }

    // Load Character onto SVG canvas
    function loadCharacter() {
      const charObj = getActiveCharacter();
      
      // Update header details
      activeCharAvatar.textContent = charObj.char;
      updateBandHighlights(charObj.band);

      // Clean SVG Dynamic Layers
      ghostGroup.innerHTML = '';
      inkGroup.innerHTML = '';
      guidesGroup.innerHTML = '';
      stepPathsList = [];

      // Build Ghost, Ink, and Arrow elements
      charObj.steps.forEach((step) => {
        // Ghost line
        const ghostPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        ghostPath.setAttribute('d', step.d);
        ghostPath.setAttribute('class', 'ghost-stroke');
        ghostGroup.appendChild(ghostPath);

        // Active ink path
        const inkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        inkPath.setAttribute('d', step.d);
        inkPath.setAttribute('class', 'active-ink');
        const length = inkPath.getTotalLength();
        inkPath.style.strokeDasharray = `${length}`;
        inkPath.style.strokeDashoffset = `${length}`;
        inkGroup.appendChild(inkPath);

        stepPathsList.push({
          element: inkPath,
          length: length,
          duration: step.duration,
          stepData: step
        });

        // Direction Arrows & Step Numbers
        if (step.num) {
          const numCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          numCircle.setAttribute('cx', step.num.x);
          numCircle.setAttribute('cy', step.num.y);
          numCircle.setAttribute('r', '15');
          numCircle.setAttribute('fill', step.num.color || '#ef4444');
          numCircle.setAttribute('stroke', '#ffffff');
          numCircle.setAttribute('stroke-width', '2.5');
          guidesGroup.appendChild(numCircle);

          const numText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          numText.setAttribute('x', step.num.x);
          numText.setAttribute('y', step.num.y + 5);
          numText.setAttribute('fill', '#ffffff');
          numText.setAttribute('font-size', '13');
          numText.setAttribute('font-weight', '900');
          numText.setAttribute('text-anchor', 'middle');
          numText.textContent = step.num.text;
          guidesGroup.appendChild(numText);
        }

        if (step.arrow) {
          const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          const endX = step.arrow.x + step.arrow.dx;
          const endY = step.arrow.y + step.arrow.dy;
          arrowPath.setAttribute('d', `M ${step.arrow.x},${step.arrow.y} L ${endX},${endY}`);
          arrowPath.setAttribute('fill', 'none');
          arrowPath.setAttribute('stroke', step.num.color || '#ef4444');
          arrowPath.setAttribute('stroke-width', '3.5');
          arrowPath.setAttribute('stroke-dasharray', '4 2');
          arrowPath.setAttribute('marker-end', `url(#${step.arrow.marker || 'arrowRed'})`);
          guidesGroup.appendChild(arrowPath);
        }
      });

      guidesGroup.style.display = showGuidanceArrows ? 'block' : 'none';

      // Reset animation to step 0
      resetAnimationSequence();
    }

    function resetAnimationSequence() {
      currentStepIndex = 0;
      stepProgress = 0;
      stateTimer = 0;
      animState = 'drawing';

      // Reset all stroke paths to hidden
      stepPathsList.forEach(item => {
        item.element.setAttribute('class', 'active-ink');
        item.element.style.strokeDashoffset = `${item.length}`;
      });

      if (stepPathsList.length > 0) {
        activePathElement = stepPathsList[0];
        const startPt = activePathElement.element.getPointAtLength(0);
        pencilTracer.setAttribute('transform', `translate(${startPt.x}, ${startPt.y})`);
        pencilTracer.style.display = 'block';
        playStepStartSound();
      }
    }

    // Central Animation Loop
    function animationLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const deltaTime = (timestamp - lastTime) * speedFactor;
      lastTime = timestamp;

      if (isPlaying && stepPathsList.length > 0) {
        if (animState === 'drawing') {
          const currentItem = stepPathsList[currentStepIndex];
          stepProgress += deltaTime / currentItem.duration;

          if (stepProgress >= 1) {
            stepProgress = 1;
            currentItem.element.style.strokeDashoffset = '0';
            currentItem.element.setAttribute('class', 'completed-ink');
            playStepEndSound();

            // Check if more steps exist
            if (currentStepIndex < stepPathsList.length - 1) {
              animState = 'pauseStep';
              stateTimer = 0;
            } else {
              animState = 'finished';
              stateTimer = 0;
              playCharacterCompleteSound();
            }
          } else {
            const currentOffset = currentItem.length * (1 - stepProgress);
            currentItem.element.style.strokeDashoffset = `${currentOffset}`;
            const pt = currentItem.element.getPointAtLength(currentItem.length * stepProgress);
            pencilTracer.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);
          }
        } 
        else if (animState === 'pauseStep') {
          stateTimer += deltaTime;
          // Move pencil toward start point of next stroke to simulate lifting pencil
          const nextItem = stepPathsList[currentStepIndex + 1];
          const nextStartPt = nextItem.element.getPointAtLength(0);
          pencilTracer.setAttribute('transform', `translate(${nextStartPt.x}, ${nextStartPt.y})`);

          if (stateTimer >= PAUSE_BETWEEN_STEPS) {
            currentStepIndex++;
            stepProgress = 0;
            animState = 'drawing';
            playStepStartSound();
          }
        }
        else if (animState === 'finished') {
          stateTimer += deltaTime;
          if (stateTimer >= PAUSE_BEFORE_LOOP) {
            resetAnimationSequence();
          }
        }
      }

      requestAnimationFrame(animationLoop);
    }

    // Play/Pause State Toggle
    function togglePlayState() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtnLabel.textContent = 'Durdur';
        playPauseBtn.className = 'btn-press bg-amber-500 hover:bg-amber-600 text-white font-extrabold px-4 sm:px-6 py-2.5 rounded-2xl shadow flex items-center gap-2 text-sm sm:text-base';
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playBtnLabel.textContent = 'Başlat';
        playPauseBtn.className = 'btn-press bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-4 sm:px-6 py-2.5 rounded-2xl shadow flex items-center gap-2 text-sm sm:text-base';
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    // Play/Pause button
    playPauseBtn.addEventListener('click', () => {
      initAudio();
      togglePlayState();
    });

    // Replay button
    replayBtn.addEventListener('click', () => {
      initAudio();
      resetAnimationSequence();
      if (!isPlaying) togglePlayState();
    });

    // Previous Character
    prevCharBtn.addEventListener('click', () => {
      initAudio();
      if (currentCharacterIndex > 0) {
        currentCharacterIndex--;
      } else {
        currentCharacterIndex = filteredCharacters.length - 1;
      }
      renderCharacterRibbon();
      loadCharacter();
    });

    // Next Character
    nextCharBtn.addEventListener('click', () => {
      initAudio();
      if (currentCharacterIndex < filteredCharacters.length - 1) {
        currentCharacterIndex++;
      } else {
        currentCharacterIndex = 0;
      }
      renderCharacterRibbon();
      loadCharacter();
    });

    // Category Tabs click
    catTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        initAudio();
        setCategory(tab.dataset.cat);
      });
    });

    // Speed Selector buttons
    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => {
          b.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
          b.classList.add('text-slate-600');
        });
        btn.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
        btn.classList.remove('text-slate-600');
        speedFactor = parseFloat(btn.dataset.speed);
      });
    });

    // Guidance Arrows Toggle
    toggleArrowsBtn.addEventListener('click', () => {
      showGuidanceArrows = !showGuidanceArrows;
      guidesGroup.style.display = showGuidanceArrows ? 'block' : 'none';
      if (showGuidanceArrows) {
        arrowsBtnText.textContent = "Okları Gizle";
        toggleArrowsBtn.classList.add('bg-slate-200');
      } else {
        arrowsBtnText.textContent = "Okları Göster";
        toggleArrowsBtn.classList.remove('bg-slate-200');
      }
    });

    // Sound Toggle
    audioToggleBtn.addEventListener('click', () => {
      initAudio();
      isSoundMuted = !isSoundMuted;
      if (isSoundMuted) {
        soundLabel.textContent = "Ses: Kapalı";
        audioToggleBtn.classList.remove('bg-amber-50', 'text-amber-900', 'border-amber-300');
        audioToggleBtn.classList.add('bg-slate-100', 'text-slate-500', 'border-slate-300');
      } else {
        soundLabel.textContent = "Ses: Açık";
        audioToggleBtn.classList.add('bg-amber-50', 'text-amber-900', 'border-amber-300');
        audioToggleBtn.classList.remove('bg-slate-100', 'text-slate-500', 'border-slate-300');
      }
    });

    // Fullscreen support for Smart Board
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen request error", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayState();
      } else if (e.code === 'KeyR') {
        resetAnimationSequence();
        if (!isPlaying) togglePlayState();
      } else if (e.code === 'ArrowLeft') {
        prevCharBtn.click();
      } else if (e.code === 'ArrowRight') {
        nextCharBtn.click();
      }
    });

    // STUDENT PRACTICE (SEN DE ÇİZ) DRAWING SYSTEM
    const canvasContext = practiceCanvas.getContext('2d');
    let isPracticeMode = false;
    let isDrawing = false;
    let activePenColor = '#dc2626';

    function resizePracticeCanvas() {
      const rect = practiceCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const dpr = window.devicePixelRatio || 1;
      practiceCanvas.width = rect.width * dpr;
      practiceCanvas.height = rect.height * dpr;
      canvasContext.scale(dpr, dpr);
    }

    window.addEventListener('resize', () => {
      if (isPracticeMode) resizePracticeCanvas();
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        if (isPracticeMode) resizePracticeCanvas();
      }, 200);
    });

    practiceToggleBtn.addEventListener('click', () => {
      initAudio();
      isPracticeMode = !isPracticeMode;
      if (isPracticeMode) {
        resizePracticeCanvas();
        practiceCanvas.classList.remove('pointer-events-none', 'opacity-0');
        practiceCanvas.classList.add('pointer-events-auto', 'opacity-100');
        practiceDrawingTools.classList.remove('hidden');
        practiceDrawingTools.classList.add('flex');
        practiceBanner.classList.remove('hidden');
        practiceBanner.classList.add('flex');
        
        practiceToggleLabel.textContent = "Animasyon";
        practiceToggleBtn.classList.remove('bg-amber-400', 'hover:bg-amber-500', 'border-amber-500');
        practiceToggleBtn.classList.add('bg-slate-200', 'hover:bg-slate-300', 'text-slate-800', 'border-slate-400');

        if (isPlaying) togglePlayState();
      } else {
        practiceCanvas.classList.add('pointer-events-none', 'opacity-0');
        practiceCanvas.classList.remove('pointer-events-auto', 'opacity-100');
        practiceDrawingTools.classList.add('hidden');
        practiceDrawingTools.classList.remove('flex');
        practiceBanner.classList.add('hidden');
        practiceBanner.classList.remove('flex');

        practiceToggleLabel.textContent = "Sen de Çiz";
        practiceToggleBtn.classList.add('bg-amber-400', 'hover:bg-amber-500', 'border-amber-500');
        practiceToggleBtn.classList.remove('bg-slate-200', 'hover:bg-slate-300', 'text-slate-800', 'border-slate-400');

        if (!isPlaying) togglePlayState();
      }
    });

    // Pen color picker
    penColorButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        penColorButtons.forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-slate-700'));
        activePenColor = btn.dataset.penColor;
        btn.classList.add('ring-2', 'ring-offset-1', 'ring-slate-700');
      });
    });

    // Clear student drawing canvas
    clearCanvasBtn.addEventListener('click', () => {
      const rect = practiceCanvas.getBoundingClientRect();
      canvasContext.clearRect(0, 0, rect.width, rect.height);
      playTone(330, 'sine', 0.15, 0.1);
    });

    // Touch & Pointer Coordinates Calculator
    function getCanvasCoordinates(e) {
      const rect = practiceCanvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onPointerDown(e) {
      if (!isPracticeMode) return;
      if (e.cancelable) e.preventDefault();
      isDrawing = true;
      const pos = getCanvasCoordinates(e);
      canvasContext.beginPath();
      canvasContext.moveTo(pos.x, pos.y);
      canvasContext.strokeStyle = activePenColor;
      canvasContext.lineWidth = window.innerWidth < 640 ? 10 : 15;
      canvasContext.lineCap = 'round';
      canvasContext.lineJoin = 'round';
      playTone(520, 'sine', 0.08, 0.05);
    }

    function onPointerMove(e) {
      if (!isDrawing || !isPracticeMode) return;
      if (e.cancelable) e.preventDefault();
      const pos = getCanvasCoordinates(e);
      canvasContext.lineTo(pos.x, pos.y);
      canvasContext.stroke();
    }

    function onPointerUp(e) {
      if (isDrawing) {
        isDrawing = false;
      }
    }

    practiceCanvas.addEventListener('mousedown', onPointerDown);
    practiceCanvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    practiceCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
    practiceCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);
    practiceCanvas.addEventListener('touchcancel', onPointerUp);

    // Bootstrap initial app state
    setCategory('kucuk');
    requestAnimationFrame(animationLoop);
  </script>
</body>
</html>
